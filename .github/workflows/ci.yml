name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # c9s must build without system OpenSSL (issue #4): TLS comes from rustls.
      - name: No OpenSSL in the dependency tree
        shell: bash
        run: |
          for crate in openssl-sys native-tls; do
            if cargo tree --locked -i "$crate" >/dev/null 2>&1; then
              echo "::error::$crate is in the dependency tree; use rustls features instead"
              cargo tree --locked -i "$crate"
              exit 1
            fi
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --workspace --locked

  msrv:
    # The oldest Rust that builds c9s; must match `rust-version` in Cargo.toml.
    # Raise both together when a dependency needs a newer compiler.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@599c45df1a24c1c63ae1129a7e59f46654b8fb66 # 1.89
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: rust-version in Cargo.toml matches this job
        run: grep -q '^rust-version = "1.89"' Cargo.toml
      - run: cargo check --workspace --all-targets --locked

  perf:
    # Rendering budget: a frame with 100k rows (filtered and unfiltered) must
    # stay under 16 ms in a release build. Today it is about 0.5 ms.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --release --locked -p c9s-tui --test render_large_list -- --ignored --nocapture

  version:
    # Code changes must bump the version (patch/minor/major); see RELEASING.md.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: bash scripts/check-version.sh "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

  audit:
    # Known vulnerabilities in dependencies (RustSec). Unmaintained or
    # unsound crates are reported as warnings (see SECURITY.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-audit
      - run: cargo audit

  install-linux:
    # The static build, its .deb and the install script, as users run them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools rpm
      - name: Shell scripts
        run: shellcheck scripts/*.sh
      - name: Static build, .deb and .rpm
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl -p c9s
          version=$(sed -n 's/^version = "\([0-9.]*\)"$/\1/p' Cargo.toml | head -1)
          scripts/package-linux.sh "$version" target/x86_64-unknown-linux-musl/release/c9s out
          sudo dpkg -i "out/c9s_${version}_amd64.deb"
          c9s -V
          rpm -qpl out/c9s-*.rpm
          sudo dpkg -r c9s
      - name: install.sh (the latest release)
        run: |
          C9S_INSTALL_DIR="$RUNNER_TEMP/bin" sh scripts/install.sh
          "$RUNNER_TEMP/bin/c9s" -V

  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: install.ps1 (the latest release)
        shell: pwsh
        run: |
          $env:C9S_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'c9s'
          ./scripts/install.ps1
          & (Join-Path $env:C9S_INSTALL_DIR 'c9s.exe') -V
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: install.ps1 under Windows PowerShell 5.1
        shell: powershell
        run: |
          $env:C9S_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'c9s51'
          ./scripts/install.ps1
          & (Join-Path $env:C9S_INSTALL_DIR 'c9s.exe') -V
          if ($LASTEXITCODE -ne 0) { exit 1 }
