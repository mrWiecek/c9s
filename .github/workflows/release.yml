name: Release

# Every push to main checks the version in Cargo.toml. If no vX.Y.Z tag exists
# for it yet, this builds binaries, tags the pushed commit and publishes a
# GitHub Release whose notes are that version's CHANGELOG.md section.
# Tags are never moved or deleted: they are the audit trail (see RELEASING.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default: only `publish` writes (tags and the release), and
# only `build` signs provenance. Dependency build scripts never run with a
# write token.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: version
        name: Is this version released?
        run: |
          version=$(sed -n 's/^version = "\([0-9.]*\)"$/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new; releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Release notes from CHANGELOG.md
        if: steps.version.outputs.release == 'true'
        run: |
          version='${{ steps.version.outputs.version }}'
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: http/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section with content"
            exit 1
          fi
          cat notes.md
      - if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notes
          path: notes.md

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          # Static (musl): runs on any Linux and WSL whatever its glibc;
          # also packaged as .deb and .rpm.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, packages: true }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Linux packaging tools
        if: matrix.packages
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools rpm
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p c9s
      - name: Package
        shell: bash
        run: |
          name="c9s-v${{ needs.plan.outputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE CHANGELOG.md "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/c9s.exe" "$name/"
            archive="$name.zip"
            7z a "$archive" "$name" >/dev/null
          else
            cp "target/${{ matrix.target }}/release/c9s" "$name/"
            archive="$name.tar.gz"
            tar czf "$archive" "$name"
          fi
          # Upload exactly what is released (out/): a glob like c9s-v*.*
          # also matches the staging directory.
          mkdir out
          mv "$archive" out/
      - name: .deb and .rpm
        if: matrix.packages
        run: |
          scripts/package-linux.sh "${{ needs.plan.outputs.version }}" \
            "target/${{ matrix.target }}/release/c9s" out
      # Signed build provenance: `gh attestation verify <archive> --repo
      # mrWiecek/c9s` proves the archive was built here, from this commit.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: out/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          ls -la
          sha256sum c9s-v*.tar.gz c9s-v*.zip c9s_*.deb c9s-*.rpm > SHA256SUMS
          cat SHA256SUMS
          # 5 archives, a .deb and an .rpm
          test "$(wc -l < SHA256SUMS)" -eq 7
      - name: Install scripts and package-manager manifests
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          scripts/manifests.sh "$VERSION" dist dist
          (cd dist && zip -qr winget-manifests.zip winget)
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file dist/notes.md \
            dist/c9s-v*.tar.gz dist/c9s-v*.zip dist/c9s_*.deb dist/c9s-*.rpm \
            dist/SHA256SUMS dist/install.sh dist/install.ps1 dist/c9s.json \
            dist/winget-manifests.zip
