[workspace]
resolver = "2"
members = [
    "crates/c9s",
    "crates/c9s-core",
    "crates/c9s-azure",
    "crates/c9s-gcp",
    "crates/c9s-aws",
    "crates/c9s-exec",
    "crates/c9s-tui",
]

[workspace.package]
version = "1.9.0"
edition = "2021"
rust-version = "1.88"
authors = ["c9s contributors"]
license = "Apache-2.0"
repository = "https://github.com/mrWiecek/c9s"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# TUI
ratatui = "0.30"
crossterm = "0.29"


# Data & serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
directories = "5.0"
